global:
  scrape_interval: 15s

  evaluation_interval: 15s


scrape_configs:

  # ==========================================================
  # PRODUCER
  # ==========================================================
  - job_name: "producer"
    static_configs:
      - targets:
          - "producer:8000"


  # ==========================================================
  # KAFKA
  # ==========================================================
  - job_name: "kafka"
    static_configs:
      - targets:
          - "kafka-exporter:9308"


  # ==========================================================
  # POSTGRESQL
  # ==========================================================
  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres-exporter:9187"


  # ==========================================================
  # SPARK APPLICATION
  # ==========================================================
  - job_name: "spark"
    static_configs:
      - targets:
          - "spark:8001"


  # ==========================================================
  # DOCKER CONTAINERS
  # ==========================================================
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"