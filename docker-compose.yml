services:

  # ==========================================================
  # ZOOKEEPER
  # ==========================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: srvr

    ports:
      - "2181:2181"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo srvr | nc -w 2 localhost 2181 | grep Mode || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s


  # ==========================================================
  # KAFKA
  # ==========================================================

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka

    depends_on:
      zookeeper:
        condition: service_healthy

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s


  # ==========================================================
  # KAFKA UI
  # ==========================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    restart: unless-stopped


  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:
    image: postgres:16
    container_name: postgres

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d

    command:
      - postgres
      - -c
      - listen_addresses=*

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    restart: unless-stopped


  # ==========================================================
  # PGADMIN
  # ==========================================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5050:80"

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    restart: unless-stopped


  # ==========================================================
  # STOCK PRODUCER
  # ==========================================================

  producer:
    build: ./producer
    container_name: producer

    expose:
      - "8000"

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY}
      SYMBOLS: ${SYMBOLS}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}

    restart: unless-stopped


  # ==========================================================
  # SPARK STREAMING
  # ==========================================================

  spark:
    build: ./spark
    container_name: spark

    depends_on:
      kafka:
        condition: service_healthy

      postgres:
        condition: service_healthy

    ports:
      - "4040:4040"
      - "8001:8001"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      SPARK_CHECKPOINT: ${SPARK_CHECKPOINT}

    volumes:
      - spark_checkpoints:/tmp/spark-checkpoints

    restart: unless-stopped


  # ==========================================================
  # KAFKA EXPORTER
  # ==========================================================

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter

    depends_on:
      kafka:
        condition: service_healthy

    command:
      - "--kafka.server=kafka:9092"

    expose:
      - "9308"

    restart: unless-stopped


  # ==========================================================
  # POSTGRES EXPORTER
  # ==========================================================

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATA_SOURCE_NAME: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

    expose:
      - "9187"

    restart: unless-stopped


  # ==========================================================
  # CADVISOR
  # ==========================================================

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor

    ports:
      - "8081:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    restart: unless-stopped


  # ==========================================================
  # PROMETHEUS
  # ==========================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    depends_on:
      producer:
        condition: service_started

      kafka-exporter:
        condition: service_started

      postgres-exporter:
        condition: service_started

      spark:
        condition: service_started

      cadvisor:
        condition: service_started

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

    restart: unless-stopped


  # ==========================================================
  # GRAFANA
  # ==========================================================

  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    depends_on:
      prometheus:
        condition: service_started

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    restart: unless-stopped


# ============================================================
# PERSISTENT VOLUMES
# ============================================================

volumes:

  pgdata:

  grafana_data:

  prometheus_data:

  spark_checkpoints: